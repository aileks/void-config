env=LIBSEAT_BACKEND,logind
env=QT_QPA_PLATFORMTHEME,qt6ct
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=LIBVA_DRIVER_NAME,nvidia
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=NVD_BACKEND,direct
env=MOZ_DISABLE_RDD_SANDBOX,1
env=BEMOJI_PICKER_CMD,rofi -dmenu -i -lines 8 -p Emoji

exec-once=dbus-update-activation-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE XCURSOR_THEME XCURSOR_SIZE QT_QPA_PLATFORMTHEME
exec-once=home-backup --save-session
exec-once=pipewire
exec-once=swaybg -m fill -i ~/.dotfiles/wallpaper/wallpaper.png
exec-once=waybar
exec-once=/usr/libexec/polkit-gnome-authentication-agent-1
exec-once=dunst
exec-once=env VK_DRIVER_FILES=/usr/share/vulkan/icd.d/nvidia_icd.json voxtype --quiet daemon
exec-once=blueman-applet
exec-once=playerctld daemon
exec-once=gnome-keyring-daemon --start --components=secrets,pkcs11
exec-once=openrgb --noautoconnect -p NRGB
exec-once=localsend
exec-once=/opt/Bitwarden/bitwarden
exec-once=emacs --daemon
exec-once=swayidle -w

tag_num=7
circle_layout=dwindle,tile,monocle
new_is_master=0
default_mfact=0.5
default_nmaster=1
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle

borderpx=2
border_radius=0
no_border_when_single=0
gappih=8
gappiv=8
gappoh=8
gappov=8
smartgaps=0
rootcolor=0x090909ff
bordercolor=0x665f5aff
focuscolor=0xaaa19aff
urgentcolor=0xede4dcff

animations=0
layer_animations=0

blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=8
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x1b1917ff
shadow_only_floating=1

syncobj_enable=1
cursor_size=24
cursor_theme=Adwaita
warpcursor=0
enable_hotarea=0

repeat_delay=250
repeat_rate=50
xkb_rules_layout=custom
mouse_accel_profile=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_disable_while_typing=1

windowrule=isfloating:1,appid:^(Qalculate-gtk|qalculate-gtk|[Bb]lueman.*|[Bb]itwarden|org\.localsend\.localsend_app|Org\.localsend\.localsend_app|polkit-gnome.*|xdg-desktop-portal-gtk|nm-connection-editor|Nm-connection-editor|imv)$
windowrule=isfloating:1,appid:^(firefox|org\.mozilla\.firefox)$,title:^(Library|Places)$
layerrule=noblur:1,noshadow:1,noanim:1,layer_name:^selection$

bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,x,spawn,emacsclient -c -a ''
bind=SUPER,w,spawn,firefox
bind=SUPER,s,spawn,signal-desktop
bind=SUPER,e,spawn,foot bash -ic 'exec nnn'
bind=SUPER,a,spawn,foot wiremix
bind=NONE,F9,spawn,voxtype record start
bindr=NONE,F9,spawn,voxtype record stop
bind=SUPER,o,spawn,region-ocr
bind=SUPER,semicolon,spawn,bemoji -n -c -t
bind=SUPER,equal,spawn,qalculate-gtk
bind=SUPER,Escape,spawn,swaylock -f
bind=SUPER,n,spawn,dunstctl set-paused toggle
bind=SUPER+CTRL+SHIFT,n,spawn,dunstctl context
bind=SUPER+SHIFT,p,spawn,power-menu
bind=SUPER,r,spawn,screenrecord menu
bind=SUPER+CTRL,r,spawn,screenrecord stop
bind=SUPER,Print,spawn,screenrecord region
bind=SUPER+SHIFT,Print,spawn,screenrecord output
bind=NONE,Print,spawn,screenshot region
bind=CTRL,Print,spawn,screenshot window
bind=SHIFT,Print,spawn,screenshot full
bind=SUPER,b,spawn,pkill -USR1 -x waybar
bind=SUPER,q,killclient
bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER+SHIFT,b,setlayout,dwindle
bind=SUPER+SHIFT,t,setlayout,tile
bind=SUPER+SHIFT,m,setlayout,monocle
bind=SUPER,Tab,switch_layout

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,l,resizewin,+50,+0

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7

bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,ddcutil setvcp 0x10 + 10
bindl=NONE,XF86MonBrightnessDown,spawn,ddcutil setvcp 0x10 - 10

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglefloating
mousebind=SUPER,btn_right,moveresize,curresize
